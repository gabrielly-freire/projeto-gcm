name: CI staging - BG Bank

on:
  pull_request:
    types:
      - closed
    branches:
      - staging

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_CACHE: 'maven'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.head.ref == 'main' ||
       startsWith(github.event.pull_request.head.ref, 'bugfix'))

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: resolver dependências com maven
        run: mvn dependency:resolve --no-transfer-progress

      - name: buildar o projeto
        run: mvn compile --no-transfer-progress

  static-analysis:
    name: Análise Estática
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: verificação estática de código
        run: mvn checkstyle:check pmd:check --no-transfer-progress

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: rodar testes unitários junit
        run: mvn test --no-transfer-progress

  publish:
    name: Publicar Release Candidate
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    permissions:
      contents: write

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: calcular e criar tag rc
        id: rc-tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          LATEST=$(git tag -l "rc-*" | grep -E "^rc-[0-9]+\.[0-9]+(\.[0-9]+)?$" | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            [ "$HEAD_BRANCH" != "main" ] && { echo "Nenhuma tag rc encontrada para base do bugfix"; exit 1; }
            NEW_TAG="rc-1.1"
          else
            X=$(echo "$LATEST" | sed 's/rc-//' | cut -d. -f1)
            Y=$(echo "$LATEST" | sed 's/rc-//' | cut -d. -f2)
            if [ "$HEAD_BRANCH" = "main" ]; then
              NEW_TAG="rc-${X}.$((Y + 1))"
            else
              LATEST_Z=$(git tag -l "rc-${X}.${Y}.*" | grep -E "^rc-${X}\.${Y}\.[0-9]+$" | sort -V | tail -1)
              Z=$(echo "${LATEST_Z:-rc-0.0.0}" | awk -F. '{print $NF}')
              NEW_TAG="rc-${X}.${Y}.$((Z + 1))"
            fi
          fi

          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: gerar pacote do sistema
        run: mvn package -DskipTests --no-transfer-progress

      - name: criar zip da versão
        run: |
          TAG="${{ steps.rc-tag.outputs.tag }}"
          zip -j "${TAG}.zip" target/*.jar

      - name: publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rc-tag.outputs.tag }}
          path: ${{ steps.rc-tag.outputs.tag }}.zip
