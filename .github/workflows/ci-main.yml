name: CI main - BG Bank

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_CACHE: 'maven'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: check do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: resolver dependências com maven
        run: mvn dependency:resolve --no-transfer-progress

      - name: buildar o projeto
        run: mvn compile --no-transfer-progress

  static-analysis:
    name: Análise Estática
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: verificação estática de código
        run: mvn checkstyle:check pmd:check --no-transfer-progress

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: configuração da JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: rodar testes unitários junit
        run: mvn test --no-transfer-progress

  publish-tag:
    name: Publicar Tag
    runs-on: ubuntu-latest
    needs: [static-analysis, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # necessário para a criação da tag

    steps:
      - name: check do repositório
        uses: actions/checkout@v4

      - name: criar e publicar tag de build
        # Só cria a tag se for um evento de push E se esse push for especificamente na branch main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag build-${{ github.run_number }}
          git push origin build-${{ github.run_number }}
