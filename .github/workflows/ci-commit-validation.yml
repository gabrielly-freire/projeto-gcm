name: Validação de Commits - BG Bank

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-commits:
    name: Validar Mensagens de Commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: check do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: tornar hook executável
        run: chmod +x hooks/commit-msg

      - name: validar mensagens de commit do PR
        run: |
          FAILED=false
          TEMP_FILE=$(mktemp)

          while IFS= read -r COMMIT_MSG; do
            [ -z "$COMMIT_MSG" ] && continue
            echo "---"
            echo "Validando: \"$COMMIT_MSG\""

            echo "$COMMIT_MSG" > "$TEMP_FILE"
            if ! ./hooks/commit-msg "$TEMP_FILE"; then
              FAILED=true
            fi
          done < <(git log --format="%s" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})

          rm -f "$TEMP_FILE"

          if [ "$FAILED" = "true" ]; then
            echo "Validação falhou: um ou mais commits não seguem as regras."
            exit 1
          fi

          echo "Todos os commits foram validados com sucesso!"
