name: entrega contínua production

on:
  pull_request:
    types:
      - closed
    branches:
      - production

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  JAVA_CACHE: 'maven'

jobs:
  pipeline:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: check do código
        uses: actions/checkout@v4

      - name: configuração do Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: ${{ env.JAVA_CACHE }}

      - name: build e testes
        run: |
          mvn dependency:resolve --no-transfer-progress
          mvn compile checkstyle:check pmd:check test --no-transfer-progress

      - name: calcular e criar tag rel
        id: rel-tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          LATEST=$(git tag -l "rel-*" | sort -V | tail -1)
          
          if [ -z "$LATEST" ]; then
            NEW_TAG="rel-1.0"
          else
            X=$(echo "$LATEST" | sed 's/rel-//' | cut -d. -f1)
            Y=$(echo "$LATEST" | sed 's/rel-//' | cut -d. -f2)
            
            if [[ "$HEAD_BRANCH" == staging ]]; then
              NEW_TAG="rel-${X}.$((Y + 1))"
            else
              Z=$(echo "$LATEST" | cut -d. -f3)
              NEW_TAG="rel-${X}.${Y}.$(( ${Z:-0} + 1 ))"
            fi
          fi
          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: gerar sistema compactado
        run: |
          mvn package -DskipTests
          zip -j "${{ steps.rel-tag.outputs.tag }}.zip" target/*.jar

      - name: publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rel-tag.outputs.tag }}
          path: ${{ steps.rel-tag.outputs.tag }}.zip

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bg-bank:${{ steps.rel-tag.outputs.tag }}